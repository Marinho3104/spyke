[package]
name = "spyke"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.1", features = ["full"] }
thiserror = "2.0.18"
tokio-util = { version = "0.7.19", features = ["codec"] }
futures-util = { version = "0.3.34", features = ["sink"] }
borsh = { version = "1.8.1", features = ["derive"] }
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }
tracing-subscriber = "0.3.23"
